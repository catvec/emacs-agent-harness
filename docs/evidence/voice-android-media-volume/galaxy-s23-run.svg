<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470">
<rect width="980" height="470" fill="#0d0d0f"/>
<text x="28" y="44" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#f2eee8">Android voice audio on a real device</text>
<text x="28" y="70" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#9a938c">Samsung Galaxy S23 (SM-S918U1) · Android 17 (API 37) · speaker · tool/voice_audio_probe.sh</text>
<text x="28" y="98" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#d65a36">volumeControlStream=3 and stream=3 are STREAM_MUSIC; mode=0 is MODE_NORMAL</text>
<line x1="28" y1="112" x2="952" y2="112" stroke="#2b2b30"/>
<text x="28" y="144" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#9a938c">output</text>
<text x="230" y="144" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#f2eee8">media / speech / music / normal / gain</text>
<text x="28" y="178" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#9a938c">begin</text>
<text x="230" y="178" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#f2eee8">mode=0  volumeControlStream=3  stream=3</text>
<text x="28" y="212" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#9a938c">round 1 playing</text>
<text x="230" y="212" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#f2eee8">usage=12/navigation contentType=1 stream=3 volume=7</text>
<text x="28" y="246" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#9a938c">round 2 playing</text>
<text x="230" y="246" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#f2eee8">usage=12/navigation contentType=1 stream=3 volume=2</text>
<text x="28" y="280" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#9a938c">round 3 playing</text>
<text x="230" y="280" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#f2eee8">usage=12/navigation contentType=1 stream=3 volume=12</text>
<text x="28" y="314" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#9a938c">end</text>
<text x="230" y="314" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#f2eee8">volumeControlStream=-2147483648  hasFocus=false</text>
<line x1="28" y1="352" x2="952" y2="352" stroke="#2b2b30"/>
<text x="28" y="380" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#7fb069">The reply's own player follows the media volume: 7 → 2 → 12, as the script moved it.</text>
<text x="28" y="408" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#9a938c">The platform reported the player itself (dumpsys audio): package com.google.android.tts,</text>
<text x="28" y="430" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#9a938c">usage=USAGE_ASSISTANCE_NAVIGATION_GUIDANCE content=CONTENT_TYPE_SPEECH mutedState:streamVolume</text>
</svg>

# Local voice stack: whisper.cpp for speech to text and Kokoro for text
# to speech.  The harness's `stacks' module starts it (`M-x
# harness-stacks'), or run it by hand:
#
#   docker compose -f scripts/stacks/voice-local/docker-compose.yml -p voice-local up -d
#
# The stack gets a container network of its own, and each service a
# random loopback port, so two stacks never fight over 8080 or 8880.
# The harness's local voice provider reads the whisper service's random
# port for speech to text and the tts service's for text to speech.
name: ${COMPOSE_PROJECT_NAME:-voice-local}

services:
  whisper:
    image: ${HARNESS_WHISPER_IMAGE:-ghcr.io/ggml-org/whisper.cpp:main}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-ggml-base.en.bin}
    volumes:
      - whisper-models:/models
      - ./whisper-entrypoint.sh:/entrypoint.sh:ro
    ports:
      # An empty host port lets the runtime pick a free one.
      - "127.0.0.1::8080"
    restart: unless-stopped
    networks:
      - voice

  tts:
    # Kokoro-FastAPI: an OpenAI-compatible /v1/audio/speech route on the
    # CPU, with the Kokoro-82M model baked into the image.  It accepts
    # the OpenAI model name tts-1 and answers WAV; the default voice is
    # warmed at startup.  A pinned release keeps a first start
    # reproducible; set HARNESS_TTS_IMAGE to run another build.
    image: ${HARNESS_TTS_IMAGE:-ghcr.io/remsky/kokoro-fastapi-cpu:v0.8.2}
    environment:
      DEFAULT_VOICE: ${HARNESS_TTS_VOICE:-af_heart}
      API_LOG_LEVEL: WARNING
    ports:
      - "127.0.0.1::8880"
    restart: unless-stopped
    networks:
      - voice

volumes:
  whisper-models:

networks:
  voice:
    # Compose would name this voice-local_voice anyway; naming it here
    # keeps the network the harness joins stable across project names.
    name: ${COMPOSE_PROJECT_NAME:-voice-local}_voice

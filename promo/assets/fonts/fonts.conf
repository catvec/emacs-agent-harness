<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  A deliberately empty font configuration for the baking scripts (src/prep.ts):
  skia-canvas gets every face explicitly through FontLibrary.use(), so the
  system's fontconfig (and its warnings) is not read, and the baked pictures do
  not depend on what the machine has installed.  Used via FONTCONFIG_FILE.
-->
<fontconfig>
  <cachedir>/var/tmp/framefields-promo-fontconfig-cache</cachedir>
</fontconfig>
